<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="golden.css">
<link rel="stylesheet" href="blue.css">
<link rel="stylesheet" href="faded.css">
<script src="crag.js" defer></script>
</head>
<body>
<main class="icons">
  <h1 class="title">App icon <span data-art="sun"></span></h1>
  <div class="icon-row">
    <figure><div class="appicon" data-icon="golden" data-art="icon"></div><figcaption>Golden hour</figcaption></figure>
    <figure><div class="appicon" data-icon="blue" data-art="icon"></div><figcaption>Blue hour</figcaption></figure>
    <figure><div class="appicon" data-icon="faded" data-art="icon"></div><figcaption>Faded print</figcaption></figure>
  </div>
  <div class="walls">
    <div class="wall-light"><div class="appicon sm" data-icon="golden" data-art="icon"></div><div class="appicon sm" data-icon="blue" data-art="icon"></div><div class="appicon sm" data-icon="faded" data-art="icon"></div></div>
    <div class="wall-dark"><div class="appicon sm" data-icon="golden" data-art="icon"></div><div class="appicon sm" data-icon="blue" data-art="icon"></div><div class="appicon sm" data-icon="faded" data-art="icon"></div></div>
  </div>
</main>
</body>
</html>
