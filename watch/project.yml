name: SendLogWatch
options:
  bundleIdPrefix: com.jirathip.sendlog
  deploymentTarget:
    watchOS: "10.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0
targets:
  SendLogWatch:
    type: application
    platform: watchOS
    sources:
      - SendLogWatch
    dependencies:
      - package: Supabase
        products:
          - Auth
          - PostgREST
    entitlements:
      path: SendLogWatch/SendLogWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: SendLogWatch/Info.plist
      properties:
        CFBundleDisplayName: Send Log
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Reads heart rate and energy during climbing workouts.
        NSHealthUpdateUsageDescription: Saves your climbing workouts to Health.
        NSMotionUsageDescription: Uses wrist motion and altitude to detect boulder attempts.
        NSBluetoothAlwaysUsageDescription: Connects to your Tindeq Progressor force gauge.
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SendLogWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - SendLogWatchTests
    dependencies:
      - target: SendLogWatch
