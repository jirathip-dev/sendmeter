name: SendmeterNative
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    revision: 528bd5fbb1689c3beff32875e7ff450d688d8db3
  SendmeterCore:
    path: .
  SendLogWatchCore:
    path: ../../ios/App/SendLogWatchCore
  SendLogHealthCore:
    path: ../../native-plugins/sendlog-health-core
targets:
  SendmeterNative:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Sources/App
        # #649: ChartTheme.swift is compiled into the SendmeterCore SwiftPM
        # module (see Package.swift) so the chart palette is unit-tested by
        # `swift test`; excluding it here keeps a single definition.
        excludes:
          - ChartTheme.swift
      - path: Sources/Data
      - path: Sources/Platform
      - path: Sources/Features
      # XcodeGen ignores the top-level `resources:` block for this spec shape
      # (verified 2.45.4: it generates no PBXResourcesBuildPhase at all), so
      # resources are declared as sources with an explicit buildPhase. The
      # AppIcon set lives in this project (Resources/Assets.xcassets), not the
      # Capacitor app's catalog — external ../ paths are dropped by XcodeGen.
      #
      # SplashCaveBackground + SplashKangaroo are PNG ports of the web splash
      # art (public/splash-cave-background.webp, public/splash-kangaroo.webp)
      # used by src/components/SplashScreen.tsx. KEEP-IN-SYNC: if the web art
      # changes, re-port it here (and update the .splash-* layout in
      # src/index.css alongside Sources/App/SendmeterNativeApp.swift#SplashView).
      - path: Resources/Info.plist
        buildPhase: none
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
      - package: SendmeterCore
        product: SendmeterCore
      - package: SendLogWatchCore
        product: SendLogWatchCore
      - package: SendLogHealthCore
        product: SendLogHealthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.native
        PRODUCT_NAME: Sendmeter
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SendmeterNative.entitlements
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 16.2
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          base:
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          base:
            SWIFT_COMPILATION_MODE: wholemodule
            SWIFT_OPTIMIZATION_LEVEL: -O
schemes:
  SendmeterNative:
    build:
      targets:
        SendmeterNative: all
    run:
      config: Debug
    archive:
      config: Release
