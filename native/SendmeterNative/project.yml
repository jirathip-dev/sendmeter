name: SendmeterNative
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    # Swift Observation (used by AppModel and TindeqBluetooth) is iOS 17+.
    # The parallel native rewrite therefore has a newer floor than the
    # existing Capacitor app; SendmeterCore remains iOS 16-compatible.
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
# Project-level version settings: every target (the app AND the widget
# appex) derives CFBundleShortVersionString / CFBundleVersion from these
# ONE place, so a version bump can never leave the appex's version
# string diverging from the app's (App Store validation rejects an
# embedded bundle whose CFBundleShortVersionString differs from the
# containing app's). The lane's CURRENT_PROJECT_VERSION xcargs override
# stays a command-line override for the build number only.
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    revision: 528bd5fbb1689c3beff32875e7ff450d688d8db3
  SendmeterCore:
    path: .
  SendLogWatchCore:
    path: ../../ios/App/SendLogWatchCore
  SendLogHealthCore:
    path: ../../native-plugins/sendlog-health-core
  # #747 slice 1: Xcode needs this project-level remote package reference so
  # SendmeterCore's SwiftPM GRDB dependency can resolve. The app target
  # intentionally does NOT link GRDB directly: exposing the product to the app
  # made the app-wide type checker time out in ActivityMixBar.swift.
  # LocalCacheStore uses `@_implementationOnly import GRDB`, and the app links
  # it through SendmeterCore's transitive product.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
targets:
  SendmeterNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
        # #649: ChartTheme.swift is compiled into the SendmeterCore SwiftPM
        # module (see Package.swift) so the chart palette is unit-tested by
        # `swift test`; excluding it here keeps a single definition.
        excludes:
          - ChartTheme.swift
      - path: Sources/Data
      - path: Sources/Platform
        excludes:
          - WeatherService.swift
      - path: Sources/Features
      # XcodeGen ignores the top-level `resources:` block for this spec shape
      # (verified 2.45.4: it generates no PBXResourcesBuildPhase at all), so
      # resources are declared as sources with an explicit buildPhase. The
      # AppIcon set lives in this project (Resources/Assets.xcassets), not the
      # Capacitor app's catalog.
      #
      # SplashCaveBackground + SplashKangaroo are PNG ports of the web splash
      # art (public/splash-cave-background.webp, public/splash-kangaroo.webp)
      # used by src/components/SplashScreen.tsx. KEEP-IN-SYNC: if the web art
      # changes, re-port it here (and update the .splash-* layout in
      # src/index.css alongside Sources/App/SendmeterNativeApp.swift#SplashView).
      - path: Resources/Info.plist
        buildPhase: none
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # #674: GuidedProtocolActivityAttributes.swift is the ActivityKit wire
      # type — compiled into BOTH the app and the widget extension from this
      # single file so the activity shape cannot drift (same-project share;
      # the web duplicates it with a KEEP-IN-SYNC comment instead).
      - path: Sources/Shared
    dependencies:
      # #674: the widget extension is embedded into the app via a target
      # dependency (XcodeGen adds the PlugIns copy-files phase automatically
      # for app-extension dependencies) — without this the .appex never ships
      # in the app bundle and Live Activities cannot render.
      - target: SendmeterNativeWidgets
      # #768: a watchOS application dependency is emitted into the host's
      # "Embed Watch Content" phase by XcodeGen. Keep the companion's bundle
      # ID aligned with the Release phone ID so WatchConnectivity can pair it.
      - target: SendLogWatch Watch App
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
      - package: SendmeterCore
        product: SendmeterCore
      - package: SendmeterCore
        product: SendmeterWeather
      - package: SendLogWatchCore
        product: SendLogWatchCore
      - package: SendLogHealthCore
        product: SendLogHealthCore
    settings:
      base:
        PRODUCT_NAME: Sendmeter
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SendmeterNative.entitlements
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 9244PWFYD7
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.native
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog
            # Fresh-derived-data Swift 6.3.3 Release archives reproduced the
            # same swift-frontend SILDeserializer crash under both this prior
            # WMO setting and the #768 singlefile experiment. No compiler-mode
            # workaround is retained; Release/signed archive validation is
            # still a #768 shipping blocker.
            SWIFT_COMPILATION_MODE: wholemodule
            SWIFT_OPTIMIZATION_LEVEL: -O
  # #808: these tests compile against the application module, not only the
  # SwiftPM Core policy target. They exercise the PostgREST/date/session
  # context wiring that swift test intentionally cannot see.
  SendmeterNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SendmeterNativeTests
    dependencies:
      - target: SendmeterNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.native.tests
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sendmeter.app/Sendmeter"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # #768: Reuse the existing Capacitor companion sources rather than creating
  # a second watch implementation. The native-only plist supplies the
  # per-configuration companion ID and version variables. XcodeGen's watchOS
  # application dependency wiring embeds this product into the iOS app at
  # Contents/Watch/SendLogWatch Watch App.app.
  'SendLogWatch Watch App':
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../../ios/App/SendLogWatch Watch App
        # Keep the generated source/resource membership explicit. The
        # entitlements file is consumed by CODE_SIGN_ENTITLEMENTS, never copied
        # into the watch bundle.
        excludes:
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
          - Resources/SupabaseConfig.plist
          - SendLogWatch.entitlements
      - path: ../../ios/App/SendLogWatch Watch App/Assets.xcassets
        buildPhase: resources
      - path: ../../ios/App/SendLogWatch Watch App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../../ios/App/SendLogWatch Watch App/Resources/SupabaseConfig.plist
        buildPhase: resources
    dependencies:
      - target: SendLogWatchWidgets
      - package: Supabase
        product: Supabase
      - package: SendLogWatchCore
        product: SendLogWatchCore
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: Resources/WatchInfo.plist
        CODE_SIGN_ENTITLEMENTS: ../../ios/App/SendLogWatch Watch App/SendLogWatch.entitlements
        SWIFT_VERSION: 5.0
        WATCHOS_DEPLOYMENT_TARGET: 10.0
        TARGETED_DEVICE_FAMILY: 4
        DEVELOPMENT_TEAM: 9244PWFYD7
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      configs:
        Debug:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.native.watchkitapp
            WATCH_COMPANION_APP_BUNDLE_IDENTIFIER: com.jirathip.sendlog.native
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.watchkitapp
            WATCH_COMPANION_APP_BUNDLE_IDENTIFIER: com.jirathip.sendlog
  # #768: Embed the existing watch complications/Smart-Stack implementation.
  # This target deliberately points at ios/App/SendLogWatchWidgets; there is
  # no native copy of its rendering or WidgetShared contract. The watch app's
  # target dependency creates its Embed Foundation Extensions phase.
  SendLogWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../../ios/App/SendLogWatchWidgets
        excludes:
          - PrivacyInfo.xcprivacy
          - SendLogWatchWidgets.entitlements
      - path: ../../ios/App/SendLogWatchWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SendLogWatchCore
        product: SendLogWatchCore
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: ../../ios/App/SendLogWatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../ios/App/SendLogWatchWidgets/SendLogWatchWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sendmeter
        SWIFT_VERSION: 5.0
        WATCHOS_DEPLOYMENT_TARGET: 10.0
        TARGETED_DEVICE_FAMILY: 4
        DEVELOPMENT_TEAM: 9244PWFYD7
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.native.watchkitapp.widgets
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.watchkitapp.widgets
  # #674: WidgetKit app-extension hosting the guided-protocol Live Activity
  # UI. XcodeGen auto-embeds an app-extension into the app that depends on it
  # (an "Embed Foundation Extensions" copy-files phase into PlugIns), so
  # listing it in the app's dependencies is all the wiring the bundle needs.
  # The native app is iOS 17+ because AppModel/TindeqBluetooth use Swift
  # Observation. The widget follows that floor so the generated project does
  # not contain an app/extension deployment mismatch.
  SendmeterNativeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared
      # Xcode 26's explicit-module build currently fails to make a local
      # Swift package product visible to an app extension (the existing watch
      # widget shows the same failure). Compile the Foundation-only wire, store,
      # date, ownership, and presentation contract from its canonical package
      # source instead. The
      # app still links SendLogHealthCore normally; the extension gets no
      # HealthKit, Supabase, or native app module dependency.
      - path: ../../native-plugins/sendlog-health-core/Sources/SendLogHealthCore/ReadinessWidgetContract.swift
    # XcodeGen ignores the top-level `resources:` block for this spec shape
      # (same quirk as the app above), so the widget's Info.plist + privacy
      # manifest are declared as sources with an explicit buildPhase. The
      # Info.plist lives OUTSIDE the synced Sources/Widgets dir (repo
      # convention for widget/appex targets). The privacy manifest lives in
      # its OWN subdirectory so it keeps the exact `PrivacyInfo.xcprivacy`
      # leaf name Apple's manifest tooling reads at the bundle root — a
      # disambiguated name (e.g. WidgetsPrivacyInfo.xcprivacy) ships the file
      # but Apple never reads it (#674 review F4).
      - path: Resources/WidgetsInfo.plist
        buildPhase: none
      - path: Resources/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: Resources/WidgetsInfo.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Widgets/SendmeterNativeWidgets.entitlements
        # GENERATE_INFOPLIST_FILE: YES lets Xcode synthesize the CFBundle*
        # keys (identifier, version, package type) on top of the NSExtension
        # dict in WidgetsInfo.plist — the same convention as the Capacitor
        # app's SendmeterWidgets target. With NO, the appex ships without a
        # bundle identifier and ValidateEmbeddedBinary rejects it.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sendmeter
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 9244PWFYD7
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.native.widgets
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.widgets
            SWIFT_COMPILATION_MODE: wholemodule
            SWIFT_OPTIMIZATION_LEVEL: -O
schemes:
  SendmeterNative:
    build:
      targets:
        SendmeterNative: all
        SendmeterNativeWidgets: all
    test:
      config: Debug
      targets:
        - name: SendmeterNativeTests
          parallelizable: false
          randomExecutionOrder: false
    run:
      config: Debug
    archive:
      config: Release
  'SendLogWatch Watch App':
    build:
      targets:
        SendLogWatch Watch App: all
        SendLogWatchWidgets: all
    run:
      config: Debug
