name: SendmeterNative
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    revision: 528bd5fbb1689c3beff32875e7ff450d688d8db3
  SendmeterCore:
    path: .
  SendLogWatchCore:
    path: ../../ios/App/SendLogWatchCore
  SendLogHealthCore:
    path: ../../native-plugins/sendlog-health-core
targets:
  SendmeterNative:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Sources/App
      - path: Sources/Data
      - path: Sources/Platform
      - path: Sources/Features
    resources:
      - path: Resources
        excludes:
          - Info.plist
      - path: ../../ios/App/App/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
      - package: SendmeterCore
        product: SendmeterCore
      - package: SendLogWatchCore
        product: SendLogWatchCore
      - package: SendLogHealthCore
        product: SendLogHealthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.sendlog.native
        PRODUCT_NAME: Sendmeter
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SendmeterNative.entitlements
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 16.2
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          base:
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          base:
            SWIFT_COMPILATION_MODE: wholemodule
            SWIFT_OPTIMIZATION_LEVEL: -O
schemes:
  SendmeterNative:
    build:
      targets:
        SendmeterNative: all
    run:
      config: Debug
    archive:
      config: Release
