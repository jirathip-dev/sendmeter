# Project-level agent-ops config. Merged over the platform defaults
# (agent-ops/config/defaults.yaml); values here win.

base_branch: staging

# Native-only since #857: there is no root package manager and no root npm
# script left, so every gate resolves through the justfile — the canonical
# entry point (see CLAUDE.md). `just fast` is the host gate (anti-slop + the
# three SwiftPM suites, no simulator); the Xcode-backed gates run in CI
# (`.github/workflows/native-swift.yml`, `just ci`).
commands:
  setup: null       # nothing to install — Xcode, XcodeGen, and just are host prerequisites
  test: just fast
  lint: just slop
  typecheck: null   # no standalone typechecker; the SwiftPM suites compile the pure packages

skills: [coding, testing]
