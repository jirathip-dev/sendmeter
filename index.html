<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Sendmeter</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E121B" />
    <script data-theme-bootstrap>
      (() => {
        try {
          const root = document.documentElement;
          let stored = null;
          try { stored = window.localStorage?.getItem("theme"); } catch {}
          const choice = stored === "light" || stored === "dark" ? stored : "system";
          let systemPrefersDark = null;
          if (choice === "system") {
            try {
              const media = window.matchMedia?.("(prefers-color-scheme: dark)");
              if (typeof media?.matches === "boolean") systemPrefersDark = media.matches;
            } catch {}
          }
          choice === "system" ? root.removeAttribute("data-theme") : root.dataset.theme = choice;
          const metas = [...document.querySelectorAll('meta[name="theme-color"]')];
          const light = metas.find((meta) => meta.getAttribute("media") === "(prefers-color-scheme: light)") || metas[0];
          const dark = metas.find((meta) => meta.getAttribute("media") === "(prefers-color-scheme: dark)") || metas.find((meta) => meta !== light);
          if (light && dark && (choice !== "system" || systemPrefersDark !== null)) {
            const active = choice === "dark" || (choice === "system" && systemPrefersDark === true) ? dark : light;
            const inactive = active === dark ? light : dark;
            active.removeAttribute("media");
            inactive.setAttribute("media", "not all");
          }
        } catch {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sendmeter" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
