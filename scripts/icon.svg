<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b2a"/>
      <stop offset="0.65" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="rock" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7d8698"/>
      <stop offset="0.55" stop-color="#5f6878"/>
      <stop offset="1" stop-color="#464e5c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="1" stop-color="#b45309" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect x="512" y="0" width="512" height="620" fill="url(#glow)"/>
  <circle cx="860" cy="170" r="7" fill="#e2e8f0" opacity="0.22"/>
  <circle cx="150" cy="120" r="5" fill="#e2e8f0" opacity="0.18"/>
  <circle cx="700" cy="80" r="4" fill="#e2e8f0" opacity="0.15"/>

  <!-- ground -->
  <rect x="0" y="812" width="1024" height="212" fill="#0c1017"/>
  <ellipse cx="512" cy="826" rx="450" ry="40" fill="#07090d"/>

  <!-- boulder: chunky leaning granite block with rounded edges -->
  <path d="M 262 816
           C 216 800 208 720 224 640
           C 240 556 262 470 296 390
           C 316 342 342 306 388 286
           C 470 250 600 218 676 232
           C 726 242 758 282 782 340
           C 816 424 844 540 838 640
           C 832 726 806 790 754 812
           C 706 830 620 824 560 824
           L 330 822
           C 302 822 280 822 262 816 Z"
        fill="url(#rock)"/>

  <!-- shaded underside (left, the overhang side) -->
  <path d="M 262 816
           C 216 800 208 720 224 640
           C 240 556 262 470 296 390
           C 316 342 342 306 388 286
           C 426 269 478 252 528 242
           C 470 340 424 450 406 560
           C 390 656 398 744 432 822
           L 330 822
           C 302 822 280 822 262 816 Z"
        fill="#39404e" opacity="0.85"/>

  <!-- top light kiss from the dusk -->
  <path d="M 600 226
           C 640 220 690 226 726 254
           C 756 278 772 306 782 340
           C 736 300 678 276 616 272
           C 570 269 532 276 502 290
           C 528 260 562 236 600 226 Z"
        fill="#98a1b2" opacity="0.8"/>

  <!-- cracks -->
  <path d="M 560 220 C 556 330 588 430 574 540 C 564 620 578 700 570 812"
        fill="none" stroke="#333a47" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
  <path d="M 574 540 C 630 560 676 600 700 660"
        fill="none" stroke="#333a47" stroke-width="9" stroke-linecap="round" opacity="0.6"/>
  <path d="M 380 560 C 420 590 444 640 448 700"
        fill="none" stroke="#2b3140" stroke-width="9" stroke-linecap="round" opacity="0.6"/>

  <!-- texture patches -->
  <ellipse cx="700" cy="420" rx="56" ry="30" fill="#6e7787" opacity="0.5" transform="rotate(-18 700 420)"/>
  <ellipse cx="660" cy="620" rx="44" ry="24" fill="#525a69" opacity="0.55" transform="rotate(10 660 620)"/>
  <ellipse cx="470" cy="380" rx="38" ry="20" fill="#525a69" opacity="0.45" transform="rotate(20 470 380)"/>
  <ellipse cx="330" cy="640" rx="40" ry="22" fill="#2f3542" opacity="0.6" transform="rotate(14 330 640)"/>

  <!-- faint chalk smudges where hands go -->
  <ellipse cx="418" cy="470" rx="26" ry="13" fill="#dfe5ec" opacity="0.28" transform="rotate(16 418 470)"/>
  <ellipse cx="452" cy="342" rx="22" ry="11" fill="#dfe5ec" opacity="0.24" transform="rotate(12 452 342)"/>

  <!-- rubble -->
  <ellipse cx="180" cy="840" rx="36" ry="14" fill="#12181f"/>
  <ellipse cx="880" cy="844" rx="44" ry="16" fill="#12181f"/>
  <ellipse cx="760" cy="856" rx="26" ry="10" fill="#0f141b"/>
</svg>
