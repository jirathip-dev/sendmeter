title = "Sendmeter secret-scan config"

[extend]
useDefault = true

# These are the app's intentionally bundled Supabase publishable anon keys.
# They are not service-role credentials: row-level security is the security
# boundary. Keep this exception limited to the two native source files and the
# exact assignment forms; credentials elsewhere must remain reportable.
[[allowlists]]
description = "Intentional Supabase publishable anon-key assignments in native files"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^ios/App/SendLogWatch Watch App/Services/SupabaseService\.swift$''',
]
# Match only the currently committed native publishable values. Hex escapes
# keep raw key material out of this configuration while remaining exact.
regexTarget = "line"
regexes = [
  '''^\s*supabaseKey:\s*"\x73\x62\x5f\x70\x75\x62\x6c\x69\x73\x68\x61\x62\x6c\x65\x5f\x41\x43\x4a\x57\x6c\x7a\x51\x48\x6c\x5a\x6a\x42\x72\x45\x67\x75\x48\x76\x66\x4f\x78\x67\x5f\x33\x42\x4a\x67\x78\x41\x61\x48"\s*,?\s*$''',
  '''^\s*private static let supabaseAnonKey\s*=\s*"\x73\x62\x5f\x70\x75\x62\x6c\x69\x73\x68\x61\x62\x6c\x65\x5f\x41\x43\x4a\x57\x6c\x7a\x51\x48\x6c\x5a\x6a\x42\x72\x45\x67\x75\x48\x76\x66\x4f\x78\x67\x5f\x33\x42\x4a\x67\x78\x41\x61\x48"\s*$''',
  '''^\s*private static let supabaseAnonKey\s*=\s*"\x73\x62\x5f\x70\x75\x62\x6c\x69\x73\x68\x61\x62\x6c\x65\x5f\x65\x48\x52\x48\x54\x65\x6c\x73\x4e\x56\x47\x4f\x63\x55\x52\x77\x34\x71\x39\x61\x31\x51\x5f\x72\x36\x73\x61\x73\x2d\x72\x70"\s*$''',
]

# #1007: the publishable-key parity test carries the Supabase CLI's fixed
# local-development publishable key so the Watch simulator literal can never
# silently drift from the local stack again. Same exception shape as above:
# exact file, exact assignment form, hex-escaped value.
[[allowlists]]
description = "Supabase CLI local-development publishable key constant in the #1007 parity test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^native/SendmeterNative/Tests/SendmeterCoreTests/PublishableKeyParityTests\.swift$''',
]
regexTarget = "line"
regexes = [
  '''^\s*private static let localDevPublishableKey\s*=\s*"\x73\x62\x5f\x70\x75\x62\x6c\x69\x73\x68\x61\x62\x6c\x65\x5f\x41\x43\x4a\x57\x6c\x7a\x51\x48\x6c\x5a\x6a\x42\x72\x45\x67\x75\x48\x76\x66\x4f\x78\x67\x5f\x33\x42\x4a\x67\x78\x41\x61\x48"\s*$''',
]

# This is an upstream anti-slop-swift README example, not application data.
# Keep the snapshot byte-exact so a changed value remains visible to the
# default generic-api-key rule.
[[allowlists]]
description = "Upstream anti-slop README fake API-key example"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tools/anti-slop-swift/README\.md$''']
regexTarget = "line"
regexes = [
  '''^\s*let apiKey = "sk-live-abc123"\s*$''',
]
