version: 2

# The repository's default branch is `staging`. Deliberately do not set
# target-branch: GitHub documents that version-update options then stop applying
# to security updates, which must continue to use the default branch and these
# security groups.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    # This limit applies to version updates; security updates keep their own
    # unthrottled path below.
    open-pull-requests-limit: 1
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      npm-production:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      npm-development:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
      # Major version updates stay separate for manual triage; they are not
      # part of the routine update path.
      npm-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:20"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      mcp-npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      mcp-npm-production:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      mcp-npm-development:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
      mcp-npm-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:40"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  # SwiftPM is a supported Dependabot ecosystem (Swift v5/v6 in GitHub's
  # current options reference). Keep one entry per manifest so generated
  # Capacitor files and the Xcode project's standalone Package.resolved are
  # not rewritten by a tool that cannot own them.
  - package-ecosystem: "swift"
    directory: "/ios/App/SendLogWatchCore"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      swift-core-security:
        applies-to: "security-updates"
        patterns: ["*"]
      swift-core-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["patch", "minor"]
      swift-core-major:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["major"]

