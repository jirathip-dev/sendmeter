version: 2

# The repository's default branch is `staging`. Deliberately do not set
# target-branch: GitHub documents that version-update options then stop applying
# to security updates, which must continue to use the default branch and these
# security groups.
updates:

  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:20"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      mcp-npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      mcp-npm-production:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      mcp-npm-development:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
      mcp-npm-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:40"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  # SwiftPM is a supported Dependabot ecosystem (Swift v5/v6 in GitHub's
  # current options reference). Keep one entry per retained manifest; generated
  # Xcode projects and package pins remain reviewable in native CI.
  - package-ecosystem: "swift"
    directory: "/ios/App/SendLogWatchCore"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      swift-core-security:
        applies-to: "security-updates"
        patterns: ["*"]
      swift-core-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["patch", "minor"]
      swift-core-major:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["major"]


  - package-ecosystem: "swift"
    directory: "/native-plugins/sendlog-health-core"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:10"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      swift-health-core-security:
        applies-to: "security-updates"
        patterns: ["*"]
      swift-health-core-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["patch", "minor"]
      swift-health-core-major:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["major"]




  - package-ecosystem: "swift"
    directory: "/native/SendmeterNative"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:30"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      swift-native-security:
        applies-to: "security-updates"
        patterns: ["*"]
      swift-native-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["patch", "minor"]
      swift-native-major:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "swift"
    directory: "/tools/anti-slop-swift"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:35"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 1
    groups:
      swift-tool-security:
        applies-to: "security-updates"
        patterns: ["*"]
      swift-tool-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["patch", "minor"]
      swift-tool-major:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["major"]
