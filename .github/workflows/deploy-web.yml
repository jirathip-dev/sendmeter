# Web deploy via Vercel CLI token. The git integration is unavailable since
# the move to the sendmeter org (private org repos need Vercel Pro — #135),
# so merge-triggered deploys happen here instead: main → production,
# staging → preview. Requires repo secrets VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID.
name: Deploy Web

on:
  push:
    branches: [main, staging]

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # vercel build runs the project's install + build itself (postinstall
      # must run — it applies the apple-sign-in SPM patch, harmless on web
      # but keeps the tree consistent).
      - name: Pull Vercel project settings
        run: >
          npx --yes vercel@56.5.0 pull --yes
          --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }}
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@56.5.0 build ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: npx --yes vercel@56.5.0 deploy --prebuilt ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
