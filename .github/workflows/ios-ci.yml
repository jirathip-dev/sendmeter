name: iOS CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging]
    paths:
      - "native/SendmeterNative/**"
      - "ios/App/SendLogWatchCore/**"
      - "ios/App/SendLogWatch Watch App/**"
      - "ios/App/SendLogWatch Watch App-Info.plist"
      - "ios/App/SendLogWatchWidgets/**"
      - "ios/App/SendLogWatchWidgets-Info.plist"
      - "native-plugins/sendlog-health-core/**"
      - "tools/anti-slop-swift/**"
      - ".anti-slop.json"
      - "scripts/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    container: "swift:6.3@sha256:4e0fc24f0f93a5cf9a91bfcf182534bbc0571d70d757389c04ff1f616c1c460f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run SendLogWatchCore tests
        env:
          TZ: UTC
        run: swift test --package-path ios/App/SendLogWatchCore

  native:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum --algorithm 256 --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        working-directory: native/SendmeterNative
        run: xcodegen generate
      - name: Build native iOS app
        working-directory: native/SendmeterNative
        run: xcodebuild -project SendmeterNative.xcodeproj -scheme SendmeterNative -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build native Watch app
        working-directory: native/SendmeterNative
        run: xcodebuild -project SendmeterNative.xcodeproj -scheme 'SendLogWatch Watch App' -configuration Debug -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
