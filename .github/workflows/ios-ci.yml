# Swift correctness gate — compiles the watch and phone targets and runs
# SendLogWatchTests on a simulator.
#
# Deliberately NOT part of ci.yml: macOS runners bill at a large multiple of
# Ubuntu (#150), and workflow-level `paths` is the only way GitHub will keep a
# macOS runner from spinning up at all on a web-only PR. A job-level `if:`
# would still allocate the runner before evaluating.
#
# This is a correctness check, not a deploy. No signing, no App Store Connect
# key, no upload, and no `[testflight]` subject gate — see testflight.yml for
# that lane.
name: iOS CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  # Manual escape hatch for verifying the lane itself without a native change.
  workflow_dispatch:

# Superseded pushes shouldn't keep an expensive runner busy.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Required even though nothing here is web: postinstall applies the
      # apple-sign-in SPM patch, and the phone target's package (CapApp-SPM)
      # is generated from node_modules. Without it the App scheme won't
      # resolve its dependencies.
      - name: Install dependencies
        run: npm ci

      - name: Xcode version
        run: xcodebuild -version

      # The scheme's test action is bound to a watchOS destination, and
      # simulator names drift between Xcode images — resolve one from the
      # runner instead of pinning a device that may not exist.
      #
      # Resolve to a UDID, not name+OS. The image carries the same watch model
      # under several runtimes, each paired to a different iPhone, so
      # "name=Apple Watch Series 11 (46mm),OS=latest" is ambiguous and
      # xcodebuild refuses it with "multiple devices matched the request".
      - name: Resolve a watchOS simulator
        id: sim
        run: |
          set -euo pipefail
          read -r udid label <<<"$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, entries in devices.items():
              m = re.search(r"watchOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in entries:
                  if not d.get("isAvailable", True):
                      continue
                  if best is None or version > best[0]:
                      best = (version, d["udid"], d["name"])
          print(f"{best[1]} {best[2]}" if best else "")
          ')"
          if [ -z "${udid:-}" ]; then
            echo "::error::No watchOS simulator available on this image."
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Using watchOS simulator: $label ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Compiling the watch target is what catches the #162 class of bug (a
      # missing `import Supabase` in OfflineQueue.swift/PendingSessionQueue.swift
      # that reached staging green and only surfaced on a manual TestFlight run).
      - name: Build watch app and tests
        run: |
          xcodebuild build-for-testing \
            -project "ios/App/App.xcodeproj" \
            -scheme "SendLogWatch Watch App" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      # `test-without-building` launches the watch app as the test host, which
      # needs a booted device — and a Watch App launch also needs its paired
      # iPhone booted, or it fails with "Simulator device failed to launch
      # com.jirathip.sendlog.watchkitapp".
      - name: Boot the watch simulator and its paired phone
        run: |
          set -euo pipefail
          watch="${{ steps.sim.outputs.udid }}"
          phone=$(xcrun simctl list pairs --json | python3 -c "
          import json, sys
          watch = sys.argv[1]
          pairs = json.load(sys.stdin)
          for pair in pairs.values():
              if pair.get('watch', {}).get('udid') == watch:
                  print(pair.get('phone', {}).get('udid', ''))
                  break
          " "$watch")
          for udid in $phone $watch; do
            echo "Booting $udid"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
          done

      # SendLogWatchTests has never executed in CI (#178). The scheme already
      # lists it under <Testables>, so this runs the whole suite.
      - name: Run SendLogWatchTests
        run: |
          xcodebuild test-without-building \
            -project "ios/App/App.xcodeproj" \
            -scheme "SendLogWatch Watch App" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      # The App target copies the built web bundle into ios/App/App/public and
      # resolves plugins from the generated CapApp-SPM package, so it cannot
      # compile without this — same prep fastlane does before `build_app`
      # (Fastfile:23). Deliberately placed after the watch steps: the watch
      # needs none of it, so a native-only regression fails before we spend
      # macOS minutes on a web build the Ubuntu `quality` job already did.
      - name: Build web bundle and sync Capacitor
        run: npm run build && npx cap sync ios

      # Compile-only: the phone app has no test target of its own, and a full
      # simulator test run isn't worth the minutes. This still catches type
      # errors and missing imports in the Capacitor host app.
      - name: Compile phone app
        run: |
          xcodebuild build \
            -project "ios/App/App.xcodeproj" \
            -scheme "App" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
