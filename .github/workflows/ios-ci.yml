# Swift correctness gate — compiles the watch and phone targets and runs
# SendLogWatchTests on a simulator.
#
# Deliberately NOT part of ci.yml: macOS runners bill at a large multiple of
# Ubuntu (#150), and workflow-level `paths` is the only way GitHub will keep a
# macOS runner from spinning up at all on a web-only PR. A job-level `if:`
# would still allocate the runner before evaluating.
#
# This is a correctness check, not a deploy. No signing, no App Store Connect
# key, no upload, and no `[testflight]` subject gate — see testflight.yml for
# that lane.
name: iOS CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  # Manual escape hatch for verifying the lane itself without a native change.
  workflow_dispatch:

# Superseded pushes shouldn't keep an expensive runner busy.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The watch suite is pure logic in the SendLogWatchCore SwiftPM package
  # (#191), so it needs no simulator and no Xcode — run it on Ubuntu, which
  # bills at a fraction of the macOS rate (#199). The macOS job below is
  # deliberately build-only as a result.
  package-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    # The official image rather than a setup action: one less third-party
    # dependency, and it pins the toolchain explicitly.
    #
    # Must track the Swift version Xcode ships (6.3 as of Xcode 26.6), not
    # just "some Swift 6": the package uses `nonisolated` on type declarations
    # (RPEModel.swift), which 6.0 rejects outright — the macOS job compiled it
    # fine while this one failed to build at all.
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4

      # UTC, so a date-boundary test can't pass locally and fail here (or the
      # reverse) purely because of the runner's zone. Calendar/DateFormatter
      # are also the Foundation surface that differs most between Apple and
      # swift-corelibs — if anything in this package is going to behave
      # differently on Linux, it is the date logic.
      - name: Run SendLogWatchCore tests
        env:
          TZ: UTC
        run: swift test --package-path ios/App/SendLogWatchCore

  swift:
    # Drafts skip the macOS compile; `package-tests` above still runs, so a
    # draft keeps its Swift feedback at the Ubuntu rate. A draft that gets
    # force-pushed repeatedly before it is ready was paying the macOS rate for
    # every one of those pushes, and marking it ready for review re-triggers
    # this job — so nothing reaches a reviewable state uncompiled. Not
    # expressible as a workflow-level filter like `paths` is, so this one does
    # allocate the runner before evaluating; the waste is seconds of idle
    # runner against minutes of Xcode.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-6vcpu-macos-26
    # 15, not 45: the p50 of this job is ~2 minutes and it has never legitimately
    # needed more than 3. The old ceiling was theoretical until a hung run on
    # fix/issue-196 sat for 30 minutes before anything cancelled it — 24% of
    # that month's entire macOS spend from one incident (#290).
    # `cancel-in-progress` does not cover this: it only fires on a superseding
    # push, so a hang on the newest commit runs to the timeout unopposed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Required even though nothing here is web: postinstall applies the
      # apple-sign-in SPM patch, and the phone target's package (CapApp-SPM)
      # is generated from node_modules. Without it the App scheme won't
      # resolve its dependencies.
      - name: Install dependencies
        run: npm ci

      - name: Xcode version
        run: xcodebuild -version

      # Build-only: the test suite runs on Linux in `package-tests` above.
      # A generic destination avoids resolving and booting a simulator
      # entirely — verified locally that it builds the same targets.
      #
      # This is still the check that catches the #162 class of bug (a missing
      # `import Supabase` in the offline queues that reached staging green),
      # and it caught #196's AuthOptions argument-order error the same way.
      - name: Compile watch app
        run: |
          xcodebuild build \
            -project "ios/App/App.xcodeproj" \
            -scheme "SendLogWatch Watch App" \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      # The App target copies the built web bundle into ios/App/App/public and
      # resolves plugins from the generated CapApp-SPM package, so it cannot
      # compile without this — same prep fastlane does before `build_app`
      # (Fastfile:23). Deliberately placed after the watch steps: the watch
      # needs none of it, so a native-only regression fails before we spend
      # macOS minutes on a web build the Ubuntu `quality` job already did.
      - name: Build web bundle and sync Capacitor
        run: npm run build && npx cap sync ios

      # Compile-only: the phone app has no test target of its own, and a full
      # simulator test run isn't worth the minutes. This still catches type
      # errors and missing imports in the Capacitor host app.
      - name: Compile phone app
        run: |
          xcodebuild build \
            -project "ios/App/App.xcodeproj" \
            -scheme "App" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
