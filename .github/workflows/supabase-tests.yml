# Disposable local-database regression gates for migration-backed behavior.
# This workflow never links to, resets, or queries either hosted project.
name: Supabase SQL

on:
  push:
    branches: [main, staging]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/test-health-precedence-race.sh"
      - ".github/workflows/supabase-tests.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/test-health-precedence-race.sh"
      - ".github/workflows/supabase-tests.yml"

jobs:
  purge-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0
      - name: Start disposable local Supabase
        run: supabase start --exclude vector --ignore-health-check

      - name: Apply current migrations to local database
        run: supabase db reset --local --no-seed

      - name: Run purge/account-deletion SQL regression
        run: supabase test db --local supabase/tests/purge_sync_generation.sql

      - name: Run health-metrics precedence SQL regression
        run: supabase test db --local supabase/tests/health_metrics_precedence.sql

      - name: Run health-metrics precedence race SQL regression
        run: bash scripts/test-health-precedence-race.sh

      - name: Run tindeq session merge SQL regression
        run: supabase test db --local supabase/tests/merge_tindeq_sessions.sql

      # #946: these two files existed in supabase/tests/ with no step anywhere,
      # so a green "Supabase SQL" check said nothing about the #521 live-mirror
      # ordering trigger or the #508-510 resisted-movement recording shape.
      # This workflow enumerates its files explicitly — a file without a step
      # is silently skipped — so keep the list complete when adding one.
      #
      # Fixture regime: both files were authored (#508-510, #521) against the
      # SEEDED local dataset — their headers say "Run after `supabase db
      # reset`" and they use the seed's account for the auth.users foreign key.
      # #830 moved the reset above to --no-seed for every other suite (those
      # files create their own accounts), so restore the seeded dataset for
      # these two steps. Running them under --no-seed is a guaranteed
      # foreign-key failure, not a contract verdict.
      #
      # Follow-up (cheaper, if the seed ever stops being maintained):
      # modernize their fixtures to create their own account — the pattern
      # health_metrics_precedence.sql and merge_tindeq_sessions.sql already
      # use. That is a test-file change, outside this lane's fence.
      - name: Reseed the disposable database for the seeded-fixture regressions
        run: supabase db reset --local

      - name: Run live-mirror ordering SQL regression
        run: supabase test db --local supabase/tests/live_mirror_ordering.sql

      - name: Run movement optional-target SQL regression
        run: supabase test db --local supabase/tests/movement_optional_measured_target.sql

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
