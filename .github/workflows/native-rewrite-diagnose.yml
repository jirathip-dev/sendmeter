name: Diagnose native rewrite payload

on:
  push:
    branches:
      - "agent/swift-native-rewrite"
    paths:
      - ".github/workflows/native-rewrite-diagnose.yml"
      - ".native-rewrite.part-01"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/swift-native-rewrite
      - name: Fingerprint payload blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          data = Path('.native-rewrite.part-01').read_bytes()
          print(f'LENGTH {len(data)}')
          print(f'SHA256 {hashlib.sha256(data).hexdigest()}')
          block = 256
          for start in range(0, len(data), block):
              chunk = data[start:start + block]
              print(f'BLOCK {start:05d} {len(chunk):03d} {hashlib.sha256(chunk).hexdigest()}')
          PY
