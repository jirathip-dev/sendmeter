# Copy this file into each managed repo at .github/workflows/triage.yml
# Replace jirathip-k with your GitHub username/org.
#
# Requires:
#   - CLAUDE_CODE_OAUTH_TOKEN available to this repo (org secret, or repo secret)
#   - The agent-ops repo must allow workflow reuse:
#     agent-ops → Settings → Actions → General → Access →
#     "Accessible from repositories owned by <you>"

name: Hourly Agent Triage

on:
  schedule:
    # Start conservative: every 4 hours. Switch to '0 * * * *' (hourly)
    # once you trust the pipeline.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}   # manual "run now" button for testing

jobs:
  triage:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller's token, and repo defaults are
    # read-only (omitting this causes an opaque startup_failure).
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # claude-code-action exchanges an OIDC token
      # The auto-merge gate must read CI before merging (#187). The repo
      # default is read-only for contents/packages and *none* for everything
      # else, so these are silently absent unless named — which is why the
      # pipeline saw "403 Resource not accessible by integration" on
      # check-runs and had to hold every otherwise-mergeable PR.
      checks: read      # check-runs (the `quality` job's conclusion)
      statuses: read    # legacy commit statuses, for the combined rollup
      actions: read     # workflow runs — distinguishes "CI failed" from
                        # "CI never ran" (a run gated on action_required)
    uses: jirathip-k/agent-ops/.github/workflows/triage-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      max_issues: 3
      auto_merge: false   # agent opens the PR and stops; merging to staging is a human step
      # 2vCPU on purpose (#150): the pipeline is Claude-API/token-bound, not
      # CPU-bound, and at ~14 min x 6 runs/day the 4vCPU tier alone burned
      # the entire Blacksmith free allowance (4vCPU consumes it at 2x).
      runner: blacksmith-2vcpu-ubuntu-2404
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional (agent-ops#53): lets the pipeline push as a GitHub App instead
      # of github-actions[bot], whose pushes produce workflow runs held on
      # manual approval — which blocks the auto-merge gate. A reusable workflow
      # cannot read the caller's secrets, so they must be forwarded here.
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
