# Applies pending migrations on merge — staging → dev project, main → prod
# (issue #130).
#
# Apply is BY NAME via scripts/apply-migrations.mjs, NOT `supabase db push`:
# prod's ledger carries apply-time versions from the MCP apply_migration era,
# so push's version-based diff would re-apply recorded history. The script is
# append-only — an unrecorded *older* migration fails the run (backfill the
# ledger row by hand; never re-run history).
#
# The Management API needs only an access token: no DB password, and no
# `supabase link`, so supabase/config.toml's hardcoded prod ref cannot
# misfire. Dependency-free (node 18+ fetch), so no npm ci.
#
# ⚠️ Merging to main applies DDL to production. `Production` is restricted to
# the main branch, but required-reviewer approval is not available on this
# plan — so the merge itself is the only human gate. See #130.
name: Deploy Migrations

on:
  push:
    branches:
      - staging
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
      - "scripts/apply-migrations.mjs"
      - "scripts/migration-safety.mjs"
  workflow_dispatch:

# Queue, never cancel: a cancelled run mid-apply would leave the ledger
# disagreeing with the schema. Same reasoning as testflight.yml.
concurrency:
  group: deploy-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    # Case matters: the environments are `Preview` and `Production`. GitHub
    # silently CREATES an environment when the name doesn't match an existing
    # one, so a lowercase name here would run with no secrets and no error.
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    steps:
      # Pin the event commit explicitly so checkout uses detached HEAD. The
      # local stale-checkout guard must not reject an already-queued deploy
      # just because a newer staging/main commit landed while it was waiting;
      # this job is intentionally responsible for the migrations visible at
      # its own reviewed push SHA, and later queued runs handle later SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/apply-migrations.mjs \
            --target ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
