name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full tree)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version

      - name: Verify synthetic secret detection
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$RUNNER_TEMP/sendmeter-gitleaks-fixture.XXXXXX")"
          cp .gitleaks.toml "$fixture/.gitleaks.toml"
          mkdir -p "$fixture/src"

          # Build the test value only inside the disposable fixture. Keeping
          # fragments separate here prevents this workflow itself from
          # containing a committed secret-shaped literal.
          synthetic_prefix='sk'
          synthetic_separator='_live_'
          synthetic_part_a='Q7m3X9v2'
          synthetic_part_b='K4p8N6r1'
          synthetic_part_c='T5w0C2h7'
          synthetic_part_d='L8s4J9y6'
          printf 'const synthetic = "%s%s%s%s%s%s";\n' \
            "$synthetic_prefix" "$synthetic_separator" \
            "$synthetic_part_a" "$synthetic_part_b" \
            "$synthetic_part_c" "$synthetic_part_d" \
            > "$fixture/src/fixture.txt"

          if gitleaks detect \
            --source "$fixture" \
            --no-git \
            --config "$fixture/.gitleaks.toml" \
            --redact --no-banner --exit-code=1; then
            echo '::error::gitleaks failed to detect the synthetic fixture secret.'
            exit 1
          else
            scan_code=$?
            if [ "$scan_code" -ne 1 ]; then
              echo "::error::gitleaks self-test returned unexpected exit code $scan_code."
              exit 1
            fi
          fi
          echo 'Synthetic secret detection passed.'

      - name: Scan checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          # --no-git makes this a current-tree scan, not a history scan. The
          # checked-out tree is the committed-file surface for this gate.
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact --no-banner --exit-code=1
