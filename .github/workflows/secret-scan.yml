name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - staging

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full tree)
    # Use the GitHub-hosted Linux runner, the same label as the repository's
    # other CI/deploy jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version

      - name: Verify generic detection and allowlist boundaries
        shell: bash
        run: |
          set -euo pipefail
          base_fixture="$(mktemp -d "$RUNNER_TEMP/sendmeter-gitleaks-fixture.XXXXXX")"
          cp .gitleaks.toml "$base_fixture/.gitleaks.toml"
          mkdir -p "$base_fixture/ios/App/SendLogWatch Watch App/Services"
          cp 'ios/App/SendLogWatch Watch App/Services/SupabaseService.swift' \
            "$base_fixture/ios/App/SendLogWatch Watch App/Services/SupabaseService.swift"
          mkdir -p "$base_fixture/tools/anti-slop-swift"
          cp tools/anti-slop-swift/README.md "$base_fixture/tools/anti-slop-swift/README.md"

          # Keep every test value temporary and assembled from fragments so
          # this workflow never contains a committed secret-shaped literal.
          secret_prefix='sb'
          secret_separator='_secret_'
          secret_part_a='Q7m3X9v2'
          secret_part_b='K4p8N6r1'
          secret_part_c='T5w0C2h7'
          secret_part_d='L8s4J9y6'
          secret_value="${secret_prefix}${secret_separator}${secret_part_a}${secret_part_b}${secret_part_c}${secret_part_d}"

          generic_part_a='Q7m3X9v2'
          generic_part_b='K4p8N6r1'
          generic_part_c='T5w0C2h7'
          generic_part_d='L8s4J9y6'
          generic_part_e='Z1q5W8e3'
          generic_value="${generic_part_a}${generic_part_b}${generic_part_c}${generic_part_d}${generic_part_e}"

          publishable_prefix='sb'
          publishable_separator='_publishable_'
          publishable_part_a='Z9c4M7n2'
          publishable_part_b='P5r8T1v6'
          publishable_part_c='X3k0H4j7'
          publishable_part_d='L2s5D8f1'
          changed_publishable="${publishable_prefix}${publishable_separator}${publishable_part_a}${publishable_part_b}${publishable_part_c}${publishable_part_d}"

          scan_expect_pass() {
            local tree="$1"
            if ! (cd "$tree" && gitleaks detect --source . --no-git \
              --config .gitleaks.toml --redact --no-banner --exit-code=1); then
              echo '::error::the committed publishable-value fixture did not pass.'
              exit 1
            fi
          }

          scan_expect_rule() {
            local label="$1"
            local tree="$2"
            local expected_rule="$3"
            local report="$tree/report.json"
            local scan_code
            set +e
            (cd "$tree" && gitleaks detect --source . --no-git \
              --config .gitleaks.toml --redact --no-banner --exit-code=1 \
              --report-format json --report-path "$report") >/dev/null 2>&1
            scan_code=$?
            set -e
            if [ "$scan_code" -ne 1 ]; then
              echo "::error::$label returned unexpected exit code $scan_code."
              exit 1
            fi
            if ! jq -e --arg rule "$expected_rule" \
              'any(.[]; .RuleID == $rule)' "$report" >/dev/null; then
              echo "::error::$label did not report $expected_rule."
              exit 1
            fi
            echo "$label detected by $expected_rule (redacted)."
          }

          replace_assignment() {
            local tree="$1"
            local value="$4"
            local file="$tree/ios/App/SendLogWatch Watch App/Services/SupabaseService.swift"
            local replacement="            supabaseKey: \"$value\","
            awk -v replacement="$replacement" '
              /supabaseKey:/ && !done { print replacement; done = 1; next }
              { print }
            ' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          }

          mutate_and_check() {
            local label="$1"
            local shape="$2"
            local occurrence="$3"
            local value="$4"
            local tree
            tree="$(mktemp -d "$RUNNER_TEMP/sendmeter-gitleaks-mutation.XXXXXX")"
            cp -R "$base_fixture/." "$tree/"
            replace_assignment "$tree" "$shape" "$occurrence" "$value"
            scan_expect_rule "$label" "$tree" generic-api-key
          }

          # The committed values remain allowed, proving the exact-value
          # exceptions still serve their intended native assignments.
          scan_expect_pass "$base_fixture"

          # This is the deterministic committed-file self-test. It is
          # keyword-adjacent and must trip generic-api-key, not Stripe.
          synthetic_tree="$(mktemp -d "$RUNNER_TEMP/sendmeter-gitleaks-synthetic.XXXXXX")"
          cp -R "$base_fixture/." "$synthetic_tree/"
          printf 'api_key = "%s"\n' "$generic_value" > "$synthetic_tree/fixture.txt"
          scan_expect_rule 'synthetic generic-api-key fixture' "$synthetic_tree" generic-api-key

          readme_tree="$(mktemp -d "$RUNNER_TEMP/sendmeter-gitleaks-readme-mutation.XXXXXX")"
          cp -R "$base_fixture/." "$readme_tree/"
          readme_file="$readme_tree/tools/anti-slop-swift/README.md"
          awk -v replacement="let apiKey = \"$generic_value\"" '
            /let apiKey =/ && !done { print replacement; done = 1; next }
            { print }
          ' "$readme_file" > "$readme_file.tmp"
          mv "$readme_file.tmp" "$readme_file"
          scan_expect_rule 'changed anti-slop README sample' "$readme_tree" generic-api-key

          for shape in watch; do
            occurrences='1'
            for occurrence in $occurrences; do
              mutate_and_check "$shape occurrence sb_secret" "$shape" 1 "$secret_value"
              mutate_and_check "$shape occurrence generic value" "$shape" 1 "$generic_value"
              mutate_and_check "$shape occurrence changed publishable value" "$shape" 1 "$changed_publishable"
            done
          done
          echo 'All allowlist mutation checks passed.'

      - name: Scan checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          # --no-git makes this a current-tree scan, not a history scan. The
          # checked-out tree is the committed-file surface for this gate.
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact --verbose --no-color --no-banner --exit-code=1
