# Copy this file into each managed repo at .github/workflows/scout.yml
# Replace jirathip-k with your GitHub username/org.
#
# Requires the same setup as the triage stub: CLAUDE_CODE_OAUTH_TOKEN secret
# and workflow-reuse access on the agent-ops repo.

name: Daily Agent Scout

on:
  schedule:
    # 01:00 Asia/Bangkok (UTC+7), daily — scout mines TODOs/gaps and files
    # up to 3 backlog issues; the 03:00 triage tick buckets them.
    - cron: '0 18 * * *'
  workflow_dispatch: {}   # manual "run now" button for testing

jobs:
  scout:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller's token.
    permissions:
      contents: read
      issues: write
    uses: jirathip-k/agent-ops/.github/workflows/scout-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      runner: blacksmith-2vcpu-ubuntu-2404
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
