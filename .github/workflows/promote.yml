# Manual promotion lane. Copied from agent-ops stubs/managed-repo-promote.yml.
#
# Opens or refreshes the staging -> main promotion PR. This lane never merges —
# promotion into main stays a human click.
#
# NOTE: the shipped stub schedules this daily (cron 30 1 * * *). This copy is
# deliberately manual-only (workflow_dispatch) — press "Run workflow" when you
# want a promotion PR. Do not read the missing cron as drift: agent doctor
# compares permissions and secrets, not triggers.
#
# Needs no Claude session and no CLAUDE_CODE_OAUTH_TOKEN — a cheap git/gh call.
# Only workflow-reuse access on the agent-ops repo is required.

name: Promotion PR (manual)

on:
  workflow_dispatch: {} # manual "run now" — this lane has no cron by design

jobs:
  promote:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller token, and repo defaults are
    # read-only (omitting these causes an opaque startup_failure).
    permissions:
      contents: read
      issues: read # run_promote reads open issues to build the Closes lines
      pull-requests: write
    uses: jirathip-k/agent-ops/.github/workflows/promote-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      runner: blacksmith-2vcpu-ubuntu-2404
