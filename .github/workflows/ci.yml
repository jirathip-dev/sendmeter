# Quality gate — lint, typecheck, tests, and a production build.
# Deployment is separate (Vercel deploys via git integration; vercel.json
# restricts deploys to main, previews to staging).
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # supabase.ts falls back to the public dev instance when VITE_ vars are
      # absent — this step only proves the bundle compiles.
      - name: Build
        run: npm run build
