# Native TestFlight — dispatch-only, cost-gated exactly like testflight.yml
# (#150). Builds the native SwiftUI app (native/SendmeterNative) from its
# Release configuration and uploads it to the existing shipped
# com.jirathip.sendlog record. The archive embeds the
# com.jirathip.sendlog.watchkitapp companion; Debug retains a separate
# .native ID for local side-by-side development (#768).
#
# macOS runner minutes are the repo's dominant CI cost and native TestFlight
# builds are an on-demand soak, not a per-merge release, so there is no push
# trigger and no [testflight]-style subject gate: workflow_dispatch only.
# Secrets come from the existing `testflight` GitHub environment (ASC API key
# + the exported Distribution cert p12) — the job must declare it to read
# them, and the name must match exactly or GitHub silently creates an empty
# environment.
#
# Ref gate (cheap Ubuntu job, mirrors testflight.yml's gate shape): the
# shipped lane demands main because only main carries the migration-verified
# schema; this lane demands the ref actually contains the native target. A
# workflow_dispatch on a branch without
# native/SendmeterNative/project.yml fails the gate before any macOS runner
# is spent.
name: Native TestFlight

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        default: blacksmith-6vcpu-macos-26
        type: string

# Native and Capacitor TestFlight builds share the shipped build-number train;
# queue native runs and never cancel them. Do not run this lane concurrently
# with the shipped `beta` lane.
concurrency:
  group: native-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decision.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: decision
        run: |
          if [ ! -f native/SendmeterNative/project.yml ]; then
            echo "native/SendmeterNative does not exist on $GITHUB_REF — native TestFlight builds need the native target (staging or a native/* branch)" >&2
            echo "build=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >>"$GITHUB_OUTPUT"

  native-beta:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ inputs.runner || 'blacksmith-6vcpu-macos-26' }}
    environment: testflight
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Matches the .mise.toml pin and testflight.yml. bundler-cache runs
      # bundle install against the committed Gemfile.lock.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      # The native target is pure Swift — no node, no npm ci, no cap sync.
      # Download a release asset at an exact version and verify its checksum;
      # the runner's moving Homebrew formula is not an acceptable CI pin.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum --algorithm 256 --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          xcodegen_bin="$RUNNER_TEMP/xcodegen/xcodegen/bin"
          echo "$xcodegen_bin" >> "$GITHUB_PATH"
          export PATH="$xcodegen_bin:$PATH"
          xcodegen --version

      - name: Write ASC API key
        run: printf '%s' "$ASC_KEY_P8" | base64 -d > fastlane/asc_api_key.p8
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      # Record the image's Xcode; pin via DEVELOPER_DIR once the Blacksmith
      # image inventory is known.
      - name: Xcode version
        run: xcodebuild -version

      - name: Build and upload native app to TestFlight
        run: LANG=en_US.UTF-8 bundle exec fastlane native_beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: fastlane/asc_api_key.p8
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # gym keeps the unmodified xcodebuild transcript separately from its
      # formatted output. Retain it only on failure so archive diagnostics are
      # actionable without changing the successful release path.
      - name: Upload raw native archive log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-archive-raw-log-${{ github.run_attempt }}
          path: ~/Library/Logs/gym/**/*.log
          if-no-files-found: error
          retention-days: 7
