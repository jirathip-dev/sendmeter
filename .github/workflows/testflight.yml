# TestFlight CD — fastlane beta, on demand (#133, cost-gated per #150).
# macOS runner minutes are the repo's dominant CI cost (Blacksmith macOS is
# billed at 20–40x the Ubuntu rate), and device verification happens in
# batches, not per-merge — so staging pushes only build when the pushed
# commit *subject* (first line) opts in with "[testflight]" (for a squash
# merge, put it in the PR title). workflow_dispatch covers everything else:
# on-demand builds, reruns, and the external-tester builds cut from main.
# No paths filter: the [testflight] tag is the single trigger source, and a
# paths filter would silently swallow a tagged merge that only touched
# untracked paths. Untagged pushes show as skipped runs, which cost nothing.
# Signing is CI-safe per #132: the beta lane imports the distribution cert
# from secrets under ENV["CI"] instead of minting one. Secrets live in the
# `testflight` GitHub environment — the job must declare it to read them.
name: TestFlight

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        default: blacksmith-6vcpu-macos-26
        type: string

# The build number is latest_testflight_build_number + 1, so two parallel
# runs would race the same number — queue, never cancel an upload.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag must be in the commit subject, not anywhere in the message:
  # contains(head_commit.message, ...) matched the whole body, so the commit
  # that introduced the gate triggered itself off its own description, and
  # any message that merely mentions the tag (docs, reverts, changelogs)
  # would start a paid macOS build. Expressions can't split lines, hence a
  # seconds-long Ubuntu job to extract the first line.
  gate:
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      build: ${{ steps.subject.outputs.build }}
    steps:
      - id: subject
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          case "$subject" in
            *"[testflight]"*) echo "build=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "build=false" >>"$GITHUB_OUTPUT" ;;
          esac

  beta:
    needs: gate
    # gate is skipped on workflow_dispatch, and a skipped need fails the
    # default success() check — !cancelled() lets the dispatch path through.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.gate.outputs.build == 'true')
    runs-on: ${{ inputs.runner || 'blacksmith-6vcpu-macos-26' }}
    environment: testflight
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Matches the .mise.toml pin. bundler-cache runs bundle install
      # against the committed Gemfile.lock (fastlane 2.237.0).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      # postinstall must run — it applies the apple-sign-in SPM patch.
      - name: Install dependencies
        run: npm ci

      - name: Write ASC API key
        run: printf '%s' "$ASC_KEY_P8" | base64 -d > fastlane/asc_api_key.p8
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      # Record the image's Xcode; pin via DEVELOPER_DIR once the Blacksmith
      # image inventory is known.
      - name: Xcode version
        run: xcodebuild -version

      - name: Build and upload to TestFlight
        run: LANG=en_US.UTF-8 bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: fastlane/asc_api_key.p8
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          # Error monitoring (#227/#239). `fastlane beta` runs its own
          # `npm run build` to produce ios/App/App/public, so the DSN has to be
          # in this step's environment or the shipped app has the SDK bundled
          # and permanently inert. VERCEL_ENV doesn't exist here, so the
          # environment tag is set explicitly — without it these events would
          # report `local` alongside a developer's laptop builds.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_DEPLOY_ENV: ios
