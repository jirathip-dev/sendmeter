# TestFlight CD — fastlane beta on merge to staging (#133).
# staging is the device-verification channel (CLAUDE.md release flow), so
# every meaningful staging merge ships a build; workflow_dispatch covers
# reruns and the external-tester builds cut from main.
# Signing is CI-safe per #132: the beta lane imports the distribution cert
# from secrets under ENV["CI"] instead of minting one. Secrets live in the
# `testflight` GitHub environment — the job must declare it to read them.
name: TestFlight

on:
  push:
    branches: [staging]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "ios/**"
      - "native-plugins/**"
      - "patches/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "fastlane/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        default: blacksmith-12vcpu-macos-26
        type: string

# The build number is latest_testflight_build_number + 1, so two parallel
# runs would race the same number — queue, never cancel an upload.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beta:
    runs-on: ${{ inputs.runner || 'blacksmith-12vcpu-macos-26' }}
    environment: testflight
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Matches the .mise.toml pin. bundler-cache runs bundle install
      # against the committed Gemfile.lock (fastlane 2.237.0).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      # postinstall must run — it applies the apple-sign-in SPM patch.
      - name: Install dependencies
        run: npm ci

      - name: Write ASC API key
        run: printf '%s' "$ASC_KEY_P8" | base64 -d > fastlane/asc_api_key.p8
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      # Record the image's Xcode; pin via DEVELOPER_DIR once the Blacksmith
      # image inventory is known.
      - name: Xcode version
        run: xcodebuild -version

      - name: Build and upload to TestFlight
        run: LANG=en_US.UTF-8 bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: fastlane/asc_api_key.p8
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
