name: gates
on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  gates:
    uses: jirathip-dev/gatekeeper/.github/workflows/gates.yml@8ee44751561f7f923e51cd9c2c6235f8e7128b45 # v1.1.2
    with:
      runners: '{"linux": "ubuntu-latest", "macos": "macos-26"}'
    secrets:
      private-names: ${{ secrets.PRIVATE_NAMES }}
